openapi: 3.0.3
info:
  title: TMC Attendance (API nội bộ và hiệu chỉnh HR)
  version: 0.3.0
  description: |
    `/internal/v1/**` chỉ gate-station gọi, không qua gateway công khai; bảo vệ bằng mTLS giữa các service (D-11).
    Lệnh nội bộ idempotent theo attemptId (ADR-05): gửi lại trả `duplicate=true`, không tạo thêm gì.
    `/hr/v1/**` yêu cầu Bearer JWT của identity, vai HR_STAFF và phạm vi nhà máy tương ứng.
    Hiệu chỉnh B-06 dùng correctionId làm khóa; xác minh B-07 dùng attemptId. Gửi lại trả `idempotentReplay=true`.
    Dev headers chỉ được phép ở profile local/inmem; Authorization có mặt thì tuyệt đối không fallback sang dev headers.
    Người sửa/xác minh luôn lấy từ subject đã xác thực, không nhận từ request body.
    Nguồn mã: InternalAttendanceController, HrAttendanceController và các input port tương ứng.
servers:
  - url: http://localhost:8082
paths:
  /internal/v1/attempts:
    post:
      summary: Ghi lượt hợp lệ ở trạng thái RESERVED (token và slot anti-passback đã giữ ở bên gọi)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AttemptRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptView" } } } }
        "400": { description: Thiếu trường bắt buộc }
  /internal/v1/attempts/denied:
    post:
      summary: Ghi lượt bị từ chối (để gửi lại cùng khóa nhận cùng câu trả lời, và để audit)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeniedRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptView" } } } }
  /internal/v1/attempts/{id}/gate-commanded:
    post:
      summary: Điểm ghi trước (write-ahead). PHẢI thành công trước khi gửi lệnh mở tới Turnstile
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptView" } } } }
        "404": { description: Lượt không tồn tại }
  /internal/v1/attempts/{id}/gate-result:
    post:
      summary: Áp dụng kết quả đã chuẩn hóa của Turnstile. OPENED thì COMMITTED + công + sự kiện cùng transaction
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [OPENED, ERROR, UNKNOWN] }
                correlationId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptView" } } } }
        "404": { description: Lượt không tồn tại }
        "409": { description: Chuyển trạng thái không hợp lệ (ví dụ kết quả đến trước khi ghi GATE_COMMANDED) }
  /internal/v1/attempts/{id}:
    get:
      summary: Trạng thái một lượt (gate-station dùng để trả lời retry)
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AttemptView" } } } }
        "404": { description: Chưa có lượt này }
  /internal/v1/employees/{employeeUuid}/last-direction:
    get:
      summary: Lượt đã tính công gần nhất của nhân viên trước một thời điểm (dựng lại anti-passback khi Redis mất dữ liệu, A-03/B-05)
      description: |
        Chỉ xét bản ghi trong `attendance_transactions` (lượt COMMITTED, không bất thường, không thủ công chờ xác minh).
        Khi có hiệu chỉnh (B-06), trả theo bản hiệu chỉnh mới nhất.
      parameters:
        - { name: employeeUuid, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: before, in: query, required: false, schema: { type: string, format: date-time }, description: "Mặc định: thời điểm hiện tại của server" }
      responses:
        "200":
          description: Có lượt
          content: { application/json: { schema: { $ref: "#/components/schemas/LastPassView" } } }
        "404": { description: Nhân viên chưa có lượt nào được tính trước thời điểm đó }
  /internal/v1/offline-batch:
    post:
      summary: Nhập journal offline theo thứ tự journalSeq. KHÔNG bao giờ gửi lệnh mở cổng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kioskId, records]
              properties:
                kioskId: { type: string }
                records:
                  type: array
                  items: { $ref: "#/components/schemas/OfflineItem" }
      responses:
        "200":
          description: Kết quả từng dòng
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    attemptId: { type: string, format: uuid }
                    outcome: { type: string, enum: [ACCEPTED, DUPLICATE, ANOMALY] }
                    detail: { type: string, nullable: true }
  /hr/v1/attendance/{attemptId}/corrections:
    post:
      operationId: correctAttendance
      summary: HR hiệu chỉnh giờ hoặc chiều của một lượt đã tính công (B-06, FR-26)
      description: |
        Không sửa access_attempts hoặc attendance_transactions gốc. Thêm một revision liên kết bản gốc
        và hai dòng outbox AttendanceCorrected, AuditRecorded trong cùng transaction.
        Khóa lượt gốc trong database để cấp revision tuần tự khi nhiều yêu cầu đồng thời.
        Cùng correctionId, cùng nội dung và cùng người sửa trả lại revision cũ (kể cả khi đã có revision mới hơn).
        Dùng lại correctionId với nội dung, người sửa hoặc lượt gốc khác trả 409.
        Lượt thủ công phải được xác minh bằng B-07 trước khi hiệu chỉnh; chưa tính công hoặc bất thường trả 409.
        scannedAt và correctedAt chuẩn hóa đến microsecond để khớp PostgreSQL.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/HrAttemptId" }
        - { $ref: "#/components/parameters/CorrelationId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionRequest" } } }
      responses:
        "200":
          description: Revision mới hoặc kết quả đã lưu của cùng yêu cầu
          content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionView" } } }
        "400": { description: Thiếu trường, UUID/chiều/thời gian sai, lý do không phải mã hợp lệ }
        "403": { description: FORBIDDEN; chưa xác thực, sai vai trò hoặc ngoài phạm vi. HR giới hạn phạm vi cũng nhận lỗi này với lượt không tồn tại }
        "404": { description: ATTEMPT_NOT_FOUND; chỉ trả khi HR có phạm vi toàn bộ nhà máy }
        "409": { description: CORRECTION_CONFLICT khi xung đột khóa; ATTENDANCE_NOT_COUNTED khi chưa có công hợp lệ }
  /hr/v1/attempts/{attemptId}/verify-manual:
    post:
      operationId: verifyManualAttendance
      summary: HR xác minh một lượt mở thủ công để tính công (B-07, FR-20)
      description: |
        Chỉ áp dụng nguồn MANUAL, trạng thái COMMITTED, không có anomaly, có employeeUuid và direction.
        Không gửi lệnh mở cổng. Giữ COMMITTED; lưu UUID HR, mã lý do và thời điểm xác minh,
        tăng version một lần rồi ghi attendance_transactions, AttendanceConfirmed và AuditRecorded cùng transaction.
        attemptId là khóa lũy đẳng: xác minh lại trả bằng chứng gốc, không đổi người/lý do/thời gian,
        không thêm công hoặc sự kiện. Quyền và phạm vi vẫn được kiểm trước mỗi lần trả kết quả.
        aggregateVersion là phiên bản của lần xác minh, không phải revision hiệu chỉnh B-06 sau đó.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/HrAttemptId" }
        - { $ref: "#/components/parameters/CorrelationId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerificationRequest" } } }
      responses:
        "200":
          description: Xác minh mới hoặc bằng chứng xác minh đã có
          content: { application/json: { schema: { $ref: "#/components/schemas/VerificationResult" } } }
        "400": { description: Thiếu trường hoặc lý do không phải mã hợp lệ }
        "403": { description: FORBIDDEN; chưa xác thực, sai vai trò hoặc ngoài phạm vi. HR giới hạn phạm vi cũng nhận lỗi này với lượt không tồn tại }
        "404": { description: ATTEMPT_NOT_FOUND; chỉ trả khi HR có phạm vi toàn bộ nhà máy }
        "409": { description: MANUAL_ATTENDANCE_NOT_VERIFIABLE; không phải MANUAL, chưa COMMITTED, có anomaly hoặc thiếu nhân viên/chiều }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    HrAttemptId: { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }
      description: Ưu tiên hơn correlationId trong body khi có giá trị; đi vào hai sự kiện outbox
  schemas:
    HrReason:
      type: string
      minLength: 2
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
      description: Mã lý do UPPER_SNAKE_CASE, không nhập tên người hoặc văn bản tự do
      example: SUPERVISOR_CONFIRMED
    CorrectionRequest:
      type: object
      required: [correctionId, direction, scannedAt, reason]
      properties:
        correctionId: { type: string, format: uuid, description: Khóa lũy đẳng do client sinh và giữ nguyên khi thử lại }
        direction: { type: string, enum: [ENTRY, EXIT] }
        scannedAt: { type: string, format: date-time }
        reason: { $ref: "#/components/schemas/HrReason" }
        correlationId: { type: string, nullable: true }
    AttendanceCorrection:
      type: object
      required: [correctionId, originalAttemptId, revision, employeeUuid, direction, scannedAt, previousDirection, previousScannedAt, reason, correctedBy, source, correctedAt]
      properties:
        correctionId: { type: string, format: uuid }
        originalAttemptId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        employeeUuid: { type: string, format: uuid }
        direction: { type: string, enum: [ENTRY, EXIT] }
        scannedAt: { type: string, format: date-time }
        previousDirection: { type: string, enum: [ENTRY, EXIT] }
        previousScannedAt: { type: string, format: date-time }
        reason: { $ref: "#/components/schemas/HrReason" }
        correctedBy: { type: string, format: uuid, description: Subject của HR đã xác thực }
        source: { type: string, enum: [ONLINE, OFFLINE, MANUAL] }
        correctedAt: { type: string, format: date-time }
    CorrectionView:
      type: object
      required: [correction, idempotentReplay, aggregateVersion]
      properties:
        correction: { $ref: "#/components/schemas/AttendanceCorrection" }
        idempotentReplay: { type: boolean }
        aggregateVersion: { type: integer, format: int64, description: Phiên bản lần xác nhận lượt gốc cộng revision }
    VerificationRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/HrReason" }
        correlationId: { type: string, nullable: true }
    VerificationResult:
      type: object
      required: [attemptId, verifiedBy, reason, verifiedAt, aggregateVersion, idempotentReplay]
      properties:
        attemptId: { type: string, format: uuid }
        verifiedBy: { type: string, format: uuid, description: Subject của HR xác minh lần đầu }
        reason: { $ref: "#/components/schemas/HrReason" }
        verifiedAt: { type: string, format: date-time }
        aggregateVersion: { type: integer, format: int64 }
        idempotentReplay: { type: boolean }
    AttemptRequest:
      type: object
      required: [attemptId, employeeUuid, gateId, factoryCode, direction, jti, scannedAt]
      properties:
        attemptId: { type: string, format: uuid }
        employeeUuid: { type: string, format: uuid }
        gateId: { type: string }
        factoryCode: { type: string }
        direction: { type: string, enum: [ENTRY, EXIT] }
        jti: { type: string, description: "Id token, KHÔNG phải token thô" }
        source: { type: string, enum: [ONLINE, OFFLINE, MANUAL], default: ONLINE }
        scannedAt: { type: string, format: date-time }
        correlationId: { type: string }
    DeniedRequest:
      type: object
      required: [attemptId, gateId, factoryCode, scannedAt, reasonCode]
      properties:
        attemptId: { type: string, format: uuid }
        employeeUuid: { type: string, format: uuid, nullable: true }
        gateId: { type: string }
        factoryCode: { type: string }
        direction: { type: string, enum: [ENTRY, EXIT], nullable: true }
        jti: { type: string, nullable: true }
        scannedAt: { type: string, format: date-time }
        reasonCode: { type: string }
        correlationId: { type: string }
    OfflineItem:
      type: object
      required: [attemptId, gateId, factoryCode, scannedAt, localStatus]
      properties:
        attemptId: { type: string, format: uuid }
        journalSeq: { type: integer, format: int64 }
        employeeUuid: { type: string, format: uuid }
        gateId: { type: string }
        factoryCode: { type: string }
        direction: { type: string, enum: [ENTRY, EXIT] }
        jti: { type: string }
        scannedAt: { type: string, format: date-time }
        localStatus: { type: string, enum: [OFFLINE_OPENED, OFFLINE_DENIED] }
        deniedReason: { type: string, nullable: true }
    LastPassView:
      type: object
      required: [employeeUuid, direction, occurredAt]
      properties:
        employeeUuid: { type: string, format: uuid }
        direction: { type: string, enum: [ENTRY, EXIT] }
        occurredAt: { type: string, format: date-time }
        factoryCode: { type: string }
        gateId: { type: string }
    AttemptView:
      type: object
      description: Bên đọc PHẢI bỏ qua trường lạ (thêm trường mới không phải thay đổi phá vỡ).
      properties:
        attemptId: { type: string, format: uuid }
        employeeUuid: { type: string, format: uuid, nullable: true, description: "null khi token không đọc được (lượt bị từ chối sớm)" }
        direction: { type: string, enum: [ENTRY, EXIT], nullable: true, description: "Để trả lời lượt gửi lại có chiều (A-06)" }
        status:
          type: string
          enum: [RECEIVED, VALIDATED, RESERVED, GATE_COMMANDED, GATE_OPENED, GATE_FAILED, GATE_UNKNOWN, COMMITTED, DENIED]
        reasonCode: { type: string, nullable: true }
        anomaly: { type: string, enum: [TOKEN_REUSED_OFFLINE, ANTI_PASSBACK_OFFLINE], nullable: true }
        duplicate: { type: boolean }
