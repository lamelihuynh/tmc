server:
  port: 8085
spring:
  application:
    name: hr-integration
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5433/hr_integration}
    username: ${HR_DB_USER:hrintegration}
    password: ${HR_DB_PASSWORD:hrintegration}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tmc}
    password: ${RABBIT_PASSWORD:tmc}
    listener:
      simple:
        # a message that keeps failing goes to the queue's DLQ after 3 tries instead of looping
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
