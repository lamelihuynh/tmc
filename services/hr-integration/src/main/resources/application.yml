server:
  port: 8085
spring:
  application:
    name: hr-integration
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5433/hr_integration}
    username: ${HR_DB_USER:hrintegration}
    password: ${HR_DB_PASSWORD:hrintegration}
  flyway:
    enabled: true
  task:
    scheduling:
      pool:
        # reconcile job, payroll deadline alert and DLQ monitor must not wait on each other
        size: 3
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tmc}
    password: ${RABBIT_PASSWORD:tmc}
    listener:
      simple:
        # a message that keeps failing goes to the queue's DLQ after 3 tries instead of looping
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
tmc:
  security:
    # D-13: identity's JWKS; dev headers off unless a dev profile turns them on
    jwks-url: ${IDENTITY_JWKS_URL:http://localhost:8087/.well-known/jwks.json}
    allow-dev-headers: ${TMC_ALLOW_DEV_HEADERS:false}
  hr:
    # simulated: no real HR system (this project runs locally only). http: send to tmc.hr.url with
    # HR_PAYROLL_API_TOKEN. Anything else stops the start-up.
    mode: ${TMC_HR_MODE:simulated}
    url: ${HR_PAYROLL_URL:}
