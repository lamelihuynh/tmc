server:
  port: 8083

spring:
  application:
    name: user-qr
  datasource:
    url: ${USERQR_DB_URL:jdbc:postgresql://localhost:5433/user_qr}
    username: ${USERQR_DB_USER:userqr}
    password: ${USERQR_DB_PASSWORD:userqr}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:tmc}
    password: ${RABBIT_PASSWORD:tmc}
    publisher-confirm-type: correlated

tmc:
  security:
    # Bearer tokens from identity are verified against this JWKS (fetched lazily, cached 5 min).
    jwks-url: ${IDENTITY_JWKS_URL:http://localhost:8087/.well-known/jwks.json}
    allow-dev-headers: ${TMC_ALLOW_DEV_HEADERS:false}
  qr:
    clock-skew-seconds: 60
    max-lifetime-seconds: 60
    # C-02: initial dev seed loaded from docs/api/fixtures/employee-seed.json (inserted only if
    # absent so durable HR updates in table `employees` survive restarts).
    employee-seed-enabled: ${TMC_EMPLOYEE_SEED_ENABLED:true}
    employee-seed-file: ${TMC_EMPLOYEE_SEED_FILE:}
