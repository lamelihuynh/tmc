server:
  port: 8083

spring:
  application:
    name: user-qr
  datasource:
    url: ${USERQR_DB_URL:jdbc:postgresql://localhost:5433/user_qr}
    username: ${USERQR_DB_USER:userqr}
    password: ${USERQR_DB_PASSWORD:userqr}

tmc:
  security:
    # Bearer tokens from identity are verified against this JWKS (fetched lazily, cached 5 min).
    jwks-url: ${IDENTITY_JWKS_URL:http://localhost:8087/.well-known/jwks.json}
    allow-dev-headers: ${TMC_ALLOW_DEV_HEADERS:false}
  qr:
    clock-skew-seconds: 60
    max-lifetime-seconds: 60
    # Employee eligibility forwarded in the sync bundle. MUST equal docs/api/fixtures/employee-seed.json
    # (EmployeeSeedContractTest). TODO Team C (C-02): HR feed instead of this list.
    employees:
      - { employee-uuid: "0192a1c0-0000-7000-8000-000000000001", active: true, factories: [BD, LA] }
      - { employee-uuid: "0192a1c0-0000-7000-8000-000000000002", active: true, factories: [BD] }
      - { employee-uuid: "0192a1c0-0000-7000-8000-000000000003", active: false, factories: [BD] }
      - { employee-uuid: "0192a1c0-0000-7000-8000-000000000004", active: true, factories: [BD, LA] }
      - { employee-uuid: "0192a1c0-0000-7000-8000-000000000005", active: true, factories: [BD, LA] }
